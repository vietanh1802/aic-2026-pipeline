name: aic2026

services:
  caddy:
    build:
      context: .
      target: caddy
    image: aic2026-caddy:local
    restart: unless-stopped
    env_file:
      - .env.deploy
    depends_on:
      - api
      - drive-proxy
    environment:
      AIC_API_HOSTNAME: ${AIC_API_HOSTNAME:-aic-api.umaga.fun}
      AIC_TLS_SNIPPET: ${AIC_TLS_SNIPPET:-tls_cloudflare}
    ports:
      - "${AIC_LOCAL_HTTP_PORT:-8080}:8080"
      - "${AIC_PUBLIC_HTTP_PORT:-80}:80"
      - "${AIC_PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: .
      target: api
      args:
        AIC_VERSION: ${AIC_VERSION:-0.0.0-dev}
        AIC_COMMIT: ${AIC_COMMIT:-unknown}
    image: aic2026-api:local
    restart: unless-stopped
    environment:
      AIC_INDEX_DIR: /opt/aic/indexes
      AIC_IMAGES_DIR: /opt/aic/static/images
      # ocr_clean.json + ocr_clean_nodau.json (55 MB) ride the same road as the
      # FAISS indexes: up to s3://aic2026-artifacts/indexes/, then
      # ssm-sync-indexes.sh pulls them onto /opt/aic/indexes on the host.
      #
      # Only an override. app/ocr_search.py already falls back to AIC_INDEX_DIR
      # above, which is where those files land — and it has to, because
      # ssm-deploy-backend.sh runs `docker compose up` against the compose file
      # ALREADY ON THE HOST. A deploy ships an image, never this file, so a
      # variable added here alone would never reach production.
      AIC_OCR_DIR: ${AIC_OCR_DIR:-/opt/aic/indexes}
      # The collaboration database. Bind-mounted to the host beside the
      # indexes and images, not left in the container's writable layer: every
      # deploy runs `compose up --force-recreate`, which would otherwise take
      # the accounts, the imported pack and the whole round's answers with it.
      # A host path rather than a named volume so it can be backed up with scp
      # and inspected without `docker volume inspect`.
      AIC_DB_PATH: /opt/aic/data/app.db
      AIC_IMAGE_BASE_URL: ${AIC_IMAGE_BASE_URL:-https://aic-frames.umaga.fun}
      AIC_CORS_ORIGINS: ${AIC_CORS_ORIGINS:-https://aic.umaga.fun}
      AIC_MODELS: ${AIC_MODELS:-}
      AIC_WARMUP: ${AIC_WARMUP:-1}
      # Read only when the Retrieval Evaluation benchmark asks for a translation
      # (app/translation.py, lazily via os.getenv). The app starts fine without
      # it; only a benchmark run fails, one query at a time, until it is set.
      #
      # Passthrough, never a value: the key comes from the host — either the
      # `.env` file docker compose reads for interpolation, next to this file at
      # /opt/aic/app/.env, or the shell that runs `docker compose up`. Like
      # AIC_OCR_DIR above, a deploy ships an image and not this file, so adding
      # the line here also means adding it by hand to /opt/aic/app/docker-compose.yml.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Nút Expand (app/expansion.py): fallback Ollama local khi Gemini chết.
      # EC2 BỎ TRỐNG (card không đủ VRAM cho qwen 27B cạnh search stack — xem
      # .env.example); chỉ máy thi tự chạy backend mới đặt giá trị này.
      # Cùng cơ chế passthrough như GEMINI_API_KEY — giá trị thật sống ở .env
      # trên host, không nằm trong repo.
      AIC_OLLAMA_URL: ${AIC_OLLAMA_URL:-}
      AIC_OLLAMA_MODEL: ${AIC_OLLAMA_MODEL:-qwen3.8:27b}
      HF_HOME: /opt/aic/model-cache/huggingface
      TORCH_HOME: /opt/aic/model-cache/torch
      XDG_CACHE_HOME: /opt/aic/model-cache/xdg
    expose:
      - "8000"
    volumes:
      - "${AIC_HOST_INDEX_DIR:-/opt/aic/indexes}:/opt/aic/indexes:ro"
      - "${AIC_HOST_IMAGES_DIR:-/opt/aic/static/images}:/opt/aic/static/images:ro"
      - "${AIC_HOST_MODEL_CACHE_DIR:-/opt/aic/model-cache}:/opt/aic/model-cache"
      - "${AIC_HOST_DATA_DIR:-/opt/aic/data}:/opt/aic/data"
    healthcheck:
      # A 200 from /health only says the process is up: it answers even when the
      # warm-up thread has died, which once let `docker ps` report healthy while
      # the API could not serve a single query. Gate on warmup.state instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['warmup']['state'] == 'ready' else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Warm-up reads ~16 GB and takes 90-145s; below this it is starting, not sick.
      start_period: 240s

  drive-proxy:
    build:
      context: .
      target: drive-proxy
    image: aic2026-drive-proxy:local
    restart: unless-stopped
    env_file:
      - .env.deploy
    environment:
      PORT: 5000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-AIzaSyAWUVtVvwOTA52orDVhTU9b9xrBwx7pWH0}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    expose:
      - "5000"
    volumes:
      - ./secrets:/run/secrets/aic:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
